services:
  db:
    image: postgres:17-alpine
    container_name: courses_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=db_quack
      - POSTGRES_USER=quack
      - POSTGRES_PASSWORD=s3cr3t
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: django_app
    command: gunicorn --bind 0.0.0.0:8000 project.wsgi:application
    # volumes: # TODO image
      # - .:/app
    environment:
      - DB_NAME=db_quack
      - DB_USER=quack
      - DB_PASSWORD=s3cr3t
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

  nginx: # TODO check image
    image: nginx:alpine
    container_name: nginx_proxy
    volumes:
      - ./lesson-06/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  postgres_data: